name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: index.html is built from src
        run: node build.mjs && git diff --exit-code index.html
      - name: compatibility checker runs on the fixture
        run: node tools/check.mjs test/fixture
      - name: smoke test in Chromium
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium && node test/smoke.mjs
